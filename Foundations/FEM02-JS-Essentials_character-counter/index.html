<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Character Counter</title>
    <meta
      name="description"
      content="Count characters, words and sentences, estimate reading time and see letter density as you type."
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <!-- Apply the saved or system theme before first paint, so the page never flashes the wrong theme -->
    <script>
      let theme;
      try {
        theme = localStorage.getItem("character-counter:theme");
      } catch {}
      document.documentElement.dataset.theme =
        theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Open+Sans&display=swap"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="header">
      <!-- One logo per theme; CSS shows the matching one -->
      <img class="logo logo--dark" src="assets/images/logo-dark-theme.svg" alt="Character Counter" width="246" height="40" />
      <img class="logo logo--light" src="assets/images/logo-light-theme.svg" alt="Character Counter" width="246" height="40" />

      <!-- Theme toggle button -->
      <button class="theme-toggle" type="button" aria-label="Toggle theme">
        <!-- Inline so the icons inherit the theme colour via currentColor -->
        <svg class="icon-sun" viewBox="0 0 20 20" width="22" height="22" aria-hidden="true">
          <path
            fill="currentColor"
            d="M10.75 1.67a.75.75 0 1 0-1.5 0zm-1.5 1.66a.75.75 0 1 0 1.5 0zm1.5 13.34a.75.75 0 1 0-1.5 0zm-1.5 1.66a.75.75 0 1 0 1.5 0zm-5.92-7.58a.75.75 0 1 0 0-1.5zm-1.66-1.5a.75.75 0 1 0 0 1.5zm3.06-3.46A.75.75 0 1 0 5.8 4.73zm-.12-2.24a.75.75 0 1 0-1.06 1.06zm9.6 1.18a.75.75 0 1 0 1.06 1.06zm2.24-.12a.75.75 0 1 0-1.06-1.06zM5.79 15.27a.75.75 0 1 0-1.06-1.06zm-2.24.12a.75.75 0 1 0 1.06 1.06zm11.72-1.18a.75.75 0 1 0-1.06 1.06zm.12 2.24a.75.75 0 0 0 1.06-1.06zm2.94-5.7a.75.75 0 1 0 0-1.5zm-1.66-1.5a.75.75 0 1 0 0 1.5zM9.25 1.67v1.66h1.5V1.67zm0 15v1.66h1.5v-1.66zM3.33 9.25H1.67v1.5h1.66zM5.8 4.73 4.61 3.55 3.55 4.61 4.73 5.8zm9.48 1.06 1.18-1.18-1.06-1.06-1.18 1.18zM4.73 14.21 3.55 15.4l1.06 1.06 1.18-1.18zm9.48 1.06 1.18 1.18 1.06-1.06-1.18-1.18zm4.12-6.02h-1.66v1.5h1.66zm-4.91.75A3.4 3.4 0 0 1 10 13.42v1.5c2.72 0 4.92-2.2 4.92-4.92zM10 13.42A3.4 3.4 0 0 1 6.58 10h-1.5c0 2.72 2.2 4.92 4.92 4.92zM6.58 10A3.4 3.4 0 0 1 10 6.58v-1.5A4.9 4.9 0 0 0 5.08 10zM10 6.58A3.4 3.4 0 0 1 13.42 10h1.5c0-2.71-2.2-4.92-4.92-4.92z"
          />
        </svg>
        <svg class="icon-moon" viewBox="0 0 20 20" width="22" height="22" aria-hidden="true">
          <path
            fill="currentColor"
            d="m18.3 10.8.74.07a.75.75 0 0 0-1.4-.44zM9.2 1.7l.38.66a.75.75 0 0 0-.45-1.4zm8.44 8.73a5.9 5.9 0 0 1-5.14 2.99v1.5a7.4 7.4 0 0 0 6.45-3.75zm-5.14 2.99A5.9 5.9 0 0 1 6.58 7.5h-1.5c0 4.1 3.32 7.42 7.42 7.42zM6.58 7.5a5.9 5.9 0 0 1 3-5.14l-.75-1.3A7.4 7.4 0 0 0 5.08 7.5zM2.42 10a7.6 7.6 0 0 1 6.85-7.55L9.13.95A9.1 9.1 0 0 0 .92 10zM10 17.58A7.6 7.6 0 0 1 2.42 10H.92A9.1 9.1 0 0 0 10 19.08zm7.55-6.85A7.6 7.6 0 0 1 10 17.58v1.5c4.72 0 8.6-3.6 9.04-8.21z"
          />
        </svg>
      </button>
    </header>

    <main>
      <h1>Analyze your text in real-time.</h1>

      <!-- Text input -->
      <div class="analyzer">
        <label class="visually-hidden" for="text-input">Text to analyze</label>
        <textarea id="text-input" placeholder="Start typing here… (or paste your text)"></textarea>

        <!-- Shown when the character limit is hit -->
        <p class="limit-message" id="limit-message" role="alert" hidden>
          <svg viewBox="5 5 13.56 13.56" width="14" height="14" aria-hidden="true">
            <path fill="currentColor" d="M11.78 5.88a5.9 5.9 0 1 0-.01 11.8 5.9 5.9 0 0 0 .01-11.8m0-.88a6.8 6.8 0 0 1 6.78 6.78A6.78 6.78 0 1 1 11.78 5m-.98 9.4h.32v-3.28h-.32a.3.3 0 0 1-.33-.32v-.22c0-.17.13-.33.33-.33h1.3c.17 0 .34.16.34.33v3.83h.33c.16 0 .32.16.32.32v.22c0 .2-.16.33-.32.33H10.8a.32.32 0 0 1-.33-.33v-.22c0-.16.13-.32.33-.32m.98-6.56a.9.9 0 0 1 .88.88c0 .5-.41.87-.88.87a.86.86 0 0 1-.87-.87c0-.47.38-.88.87-.88" />
          </svg>
          <span id="limit-text"></span>
        </p>

        <!-- checkbox options -->
        <div class="options">
          <label class="checkbox"><input type="checkbox" id="exclude-spaces" /> Exclude Spaces</label>
          <label class="checkbox"><input type="checkbox" id="limit-toggle" /> Set Character Limit</label>
          <input class="limit-input" type="number" id="limit-input" value="300" min="1" aria-label="Character limit" hidden />
          <p class="reading-time">Approx. reading time: <span id="reading-time">0 minute</span></p>
        </div>
      </div>

      <!-- stat cards -->
      <dl class="stats">
        <div class="stat-card stat-card--characters">
          <dt id="char-label">Total Characters</dt>
          <dd id="char-count">00</dd>
        </div>
        <div class="stat-card stat-card--words">
          <dt>Word Count</dt>
          <dd id="word-count">00</dd>
        </div>
        <div class="stat-card stat-card--sentences">
          <dt>Sentence Count</dt>
          <dd id="sentence-count">00</dd>
        </div>
      </dl>

      <!-- Letter density section -->
      <section class="density">
        <h2>Letter Density</h2>
        <p id="density-empty">No characters found. Start typing to see letter density.</p>
        <ul class="density-list" id="density-list"></ul>
        <button class="density-toggle" id="density-toggle" type="button" aria-expanded="false" hidden>
          <span>See more</span>
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" aria-hidden="true">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="m4 6 4 4 4-4" />
          </svg>
        </button>
      </section>
    </main>

    <!-- Template for density rows -->
    <template id="density-row">
      <li>
        <span class="density-letter"></span>
        <span class="density-bar" aria-hidden="true"><span></span></span>
        <span class="density-value"></span>
      </li>
    </template>
  </body>
</html>
